services:
  - type: web
    name: frontdesk-app
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOW_DEMO_SEED
        value: "true"
      - key: PORT
        value: "3000"

databases:
  - name: frontdesk-db
    plan: free
    databaseName: frontdesk
    user: frontdesk
